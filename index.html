<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="bonne journée - un gros buzzer rétro qui lance une vidéo locale au hasard." />
  <title>bonne journée</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fff3d6;
      --ink: #251100;
      --shadow: #6e2400;
      --panel: #fff8e7;
      --red-1: #ff4b3e;
      --red-2: #d91b1b;
      --red-3: #a90f12;
      --yellow: #ffd84d;
      --blue: #26a7ff;
      --green: #36c56d;
      --orange: #ff9d2f;
      --pink: #ff5fc9;
      --white: #fffaf4;
      --font-display: 'Press Start 2P', monospace;
      --font-body: 'Fredoka', system-ui, sans-serif;
      --transition: 160ms cubic-bezier(.2,.8,.2,1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      font-family: var(--font-body);
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.4) 0 2px, transparent 2px 100%),
        radial-gradient(circle at 80% 30%, rgba(255,255,255,.35) 0 2px, transparent 2px 100%),
        radial-gradient(circle at 50% 70%, rgba(255,255,255,.35) 0 2px, transparent 2px 100%),
        linear-gradient(180deg, #ffeaa8 0%, var(--bg) 100%);
      background-size: 140px 140px, 180px 180px, 220px 220px, auto;
      padding: 1.5rem;
    }
    .wrap {
      width: min(1200px, 100%);
      margin: 0 auto;
      min-height: calc(100dvh - 3rem);
      display: grid;
      grid-template-columns: minmax(340px, 420px) minmax(520px, 1fr);
      gap: 2.5rem;
      align-items: center;
    }
    .left {
      display: grid;
      justify-items: center;
      gap: 1.6rem;
      text-align: center;
    }
    .buzzer-shell {
      position: relative;
      width: min(100%, 420px);
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
    }
    .burst {
      position: absolute;
      inset: 8%;
      background:
        radial-gradient(circle, rgba(255,216,77,.95) 0 35%, transparent 36%),
        conic-gradient(from 0deg, var(--yellow) 0 8%, transparent 8% 16%, var(--pink) 16% 24%, transparent 24% 32%, var(--blue) 32% 40%, transparent 40% 48%, var(--green) 48% 56%, transparent 56% 64%, var(--orange) 64% 72%, transparent 72% 80%, var(--yellow) 80% 88%, transparent 88% 100%);
      clip-path: polygon(50% 0%, 58% 18%, 74% 4%, 71% 24%, 92% 14%, 80% 34%, 100% 36%, 82% 50%, 100% 64%, 79% 66%, 91% 87%, 70% 76%, 72% 96%, 56% 82%, 50% 100%, 42% 82%, 26% 96%, 29% 76%, 8% 87%, 20% 66%, 0% 64%, 18% 50%, 0% 36%, 20% 34%, 8% 14%, 29% 24%, 26% 4%, 42% 18%);
      opacity: .95;
    }
    .buzzer-base {
      position: absolute;
      inset: 15% 12% 8%;
      border-radius: 50%;
      background: linear-gradient(180deg, #f7efe4, #d4c7b8);
      border: 6px solid var(--ink);
      box-shadow: 0 16px 0 var(--shadow);
    }
    .buzzer {
      position: relative;
      z-index: 2;
      width: 74%;
      aspect-ratio: 1 / 1;
      border: 6px solid var(--ink);
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, #ff9a8f 0 18%, transparent 19%),
        radial-gradient(circle at 50% 38%, var(--red-1) 0 44%, var(--red-2) 45% 72%, var(--red-3) 73% 100%);
      color: var(--white);
      display: grid;
      place-items: center;
      padding: 1.5rem;
      box-shadow: inset 0 -16px 0 rgba(0,0,0,.18), inset 0 10px 0 rgba(255,255,255,.25), 0 14px 0 var(--shadow), 0 20px 30px rgba(105, 24, 0, .24);
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition), filter var(--transition);
      text-transform: uppercase;
      font-family: var(--font-display);
      font-size: clamp(1rem, .8rem + 1vw, 1.6rem);
      line-height: 1.4;
      letter-spacing: .08em;
    }
    .buzzer:hover,
    .buzzer:focus-visible { transform: translateY(-4px) rotate(-1deg); }
    .buzzer:active {
      transform: translateY(8px) scale(.98);
      box-shadow: inset 0 -10px 0 rgba(0,0,0,.18), inset 0 6px 0 rgba(255,255,255,.18), 0 6px 0 var(--shadow), 0 8px 14px rgba(105,24,0,.22);
    }
    .spark {
      position: absolute;
      font-family: var(--font-display);
      font-size: clamp(.75rem, .6rem + .6vw, 1rem);
      color: var(--white);
      background: var(--ink);
      border: 4px solid var(--white);
      border-radius: 999px;
      padding: .5rem .8rem;
      box-shadow: 0 6px 0 rgba(37,17,0,.45);
      transform: rotate(var(--r));
    }
    .spark.one { top: 5%; left: 8%; --r: -10deg; }
    .spark.two { top: 10%; right: 5%; --r: 7deg; }
    .spark.three { bottom: 8%; left: 3%; --r: -8deg; }
    .player-card {
      background: rgba(255,248,231,.76);
      border: 5px solid var(--ink);
      border-radius: 28px;
      box-shadow: 0 14px 0 var(--ink);
      padding: 1rem 1.5rem;
      display: grid;
      gap: 1rem;
      min-height: 72vh;
    }
    .screen {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      min-height: 62vh;
      border: 5px solid var(--ink);
      border-radius: 20px;
      overflow: hidden;
      background: #000;
    }
    .screen video {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
      object-fit: cover;
    }
    @media (max-width: 900px) {
      .wrap { grid-template-columns: 1fr; gap: 1rem; min-height: auto; }
      .left { order: 1; gap: 1rem; }
      .player-card { order: 2; min-height: auto; padding: .75rem; }
      .screen { min-height: 52vh; aspect-ratio: 16 / 11; }
      .buzzer-shell { width: min(84vw, 360px); }
      .buzzer { font-size: clamp(.85rem, 3.4vw, 1.25rem); }
      .spark { display: none; }
      body { padding: .75rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="left">
      <div class="buzzer-shell">
        <div class="burst"></div>
        <div class="buzzer-base"></div>
        <div class="spark one">GO!</div>
        <div class="spark two">BIM!</div>
        <div class="spark three">CLIC!</div>
        <button class="buzzer" id="playButton" type="button" aria-label="Lancer une vidéo locale au hasard">
          bonne<br>journée
        </button>
      </div>

    </section>

    <section class="player-card" aria-labelledby="lecteur-titre">
      <div class="screen">
        <video id="videoPlayer" controls playsinline>
          Votre navigateur ne supporte pas la balise vidéo.
        </video>
      </div>
    </section>
  </main>

  <script>
    const videos = [
      'https://pub-828cd6197e26481aa9298e86da863b7f.r2.dev/video1.mp4',
      'https://pub-828cd6197e26481aa9298e86da863b7f.r2.dev/video2.mp4',
      'https://pub-828cd6197e26481aa9298e86da863b7f.r2.dev/video3.mp4',
      'https://pub-828cd6197e26481aa9298e86da863b7f.r2.dev/video4.mp4',
      'https://pub-828cd6197e26481aa9298e86da863b7f.r2.dev/video5.mp4',
      'https://pub-828cd6197e26481aa9298e86da863b7f.r2.dev/video6.mp4',
      'https://pub-828cd6197e26481aa9298e86da863b7f.r2.dev/video7.mp4'
    ];
    const videoPlayer = document.getElementById('videoPlayer');
    const playButton = document.getElementById('playButton');
    let currentUrl = null;

    function loadRandomVideo() {
      const randomPath = videos[Math.floor(Math.random() * videos.length)];
      if (currentUrl) URL.revokeObjectURL(currentUrl);
      videoPlayer.src = randomPath;
      videoPlayer.load();
      videoPlayer.play().catch(() => {});
    }

    playButton.addEventListener('click', loadRandomVideo);
  </script>
</body>
</html>
